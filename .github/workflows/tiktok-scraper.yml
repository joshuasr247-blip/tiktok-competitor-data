name: TikTok Competitor Scanner

on:
  schedule:
    # Runs daily at 9:00 AM UTC (5 AM ET)
    - cron: '0 9 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write # needed to commit ads.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: competitor-scanner/package-lock.json

      - name: Install dependencies
        working-directory: competitor-scanner
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: competitor-scanner
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: competitor-scanner
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: node scripts/tiktok-scraper.mjs

      - name: Commit updated ads.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor-scanner/data/ads.json
          git diff --staged --quiet || git commit -m "chore: daily competitor scan $(date -u +%Y-%m-%d)"
          git push
