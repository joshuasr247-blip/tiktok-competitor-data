name: UGC Scanner (TikTok + Instagram)

on:
  schedule:
    - cron: '0 9 * * *'   # 9 AM UTC daily
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: competitor-scanner/package-lock.json

      - name: Install dependencies
        working-directory: competitor-scanner
        run: npm ci

      - name: Run UGC scraper (TikTok + Instagram)
        working-directory: competitor-scanner
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: node scripts/ugc-scraper.mjs

      - name: Commit updated ads.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor-scanner/data/ads.json
          git diff --staged --quiet || git commit -m "chore: daily competitor scan $(date -u +%Y-%m-%d)"
          git push
